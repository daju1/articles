# MODE: гиротропный феррит (LLG): намагниченность связывает Hy и Hz, поэтому обновляются ОБЕ пары
# (TE и TM) при любом polarization (печатается пояснение). Возбуждение jm_z (TE), но при bias x
# прецессия M вокруг x перекачивает энергию в TM-пару (Ez, Hy) -- аналог mu_yz, mu_zy ноутбуков.
#   ./mendrive -c examples/mode_jm_z_right_LLG_both.cfg && python3 plot.py out/mode_jm_z_right_LLG
N = 160
ferrite_model = LLG
excitation_mode = jm_z_right
polarization = auto
bias_orientation = x
H0_bias = 4.0
Ms_llg = 0.3
gamma_llg = 1.0
alpha_llg = 0.1
sigma_e_left = 3.0
omega0 = 3.0
n_periods_total = 60
record_from_period = 20
amp = 1
fields_harm = 1,2,3
fields_harm_periods = 20
fields_snap_phases = 0,0.25,0.5,0.75
out_dir = out/mode_jm_z_right_LLG
