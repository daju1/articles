# FIELDS: сверка ./mendrive с ТОЧНЫМ линейным решением (linear1d.py) -- TE, jm_z в ферритовой стенке.
#   ./mendrive -c examples/linear_check_TE.cfg
#   python3 linear1d.py out/linear_check_TE
#   python3 plot.py out/linear_check_TE --compare out/linear_check_TE/linear_analytic_n1.csv --fit none --norm none
# Ожидаемо: rel_L2 ~ 1-2% при N=160 (ошибка дискретизации O(dx)), без подбора фазы и нормы.
N = 160
a = 0.2
h_l = 0.2
h_r = 0.2
dt_frac = 0.2
ferrite_model = Linear      # B = mu*H: эталон для сверки с линейной моделью
mu_yy_lin = 3.0
mu_zz_lin = 3.0
sigma_m_leak = 0.3          # магнитная проводимость феррита (sigma_m ноутбуков в код-единицах)
eps_ferrite = 2.0
sigma_e_ferrite = 0.2
sigma_e_left = 3.0
skin_depth = 0.06
src_k_phase = 5.0           # профиль источника exp(i K xi), K = src_k_phase + i/skin_depth
src_sigma_fix = 1
omega0 = 3.0
amp = 1
ramp_periods = 2
n_periods_total = 60
record_from_period = 20
fields_harm = 1
fields_harm_periods = 20
fields_harm_normalize = none
fields_snap_phases = 0,0.25,0.5,0.75
time_convention = minus
ts_every = 0
excitation_mode = jm_z_right
out_dir = out/linear_check_TE
