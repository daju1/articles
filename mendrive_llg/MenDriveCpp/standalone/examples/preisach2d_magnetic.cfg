# Preisach2D -- режим, на котором падало ядро Python.
# Сетка Прейзаха задаётся ЯВНО через n_grid (n_grid^2 пар); быстрый алгоритм rows.
# Запуск:  ./mendrive -c examples/preisach2d_magnetic.cfg
#          caffeinate -i ./mendrive -c examples/preisach2d_magnetic.cfg     # macOS: не засыпать
# Сначала прикиньте время на коротком прогоне:  ... n_periods_total=20 record_from_period=5 out_dir=out/p2d_try

N = 160
ferrite_model = Preisach2D
pr2d_algo = rows
n_grid = 201               # 40 401 пар; n_grid=2001 тоже возможно (~10x дольше), память ~0.3 МБ
excitation_mode = magnetic_right
bias_orientation = x
H0_bias = 4.0
n_sub = 2
n_fp = 2
n_newton = 4
sigma_m_leak = 3.0
sigma_e_left = 3.0
sigma_m_leak_pr = 3.0
n_periods_total = 8000
record_from_period = 1000
amp = 1
omega0 = 3.0

out_dir = out/p2d_mag_amp1
threads = 6                # M1 Pro: 8 производительных ядер; оставьте 1-2 под систему
ts_every = 10
ts_last_periods = 20
checkpoint_every_periods = 100
checkpoint_every_sec = 1800
