# MenDrive_qnm.ipynb, driving_mode_1 = 'je_y, k_y=0, TE'  ->  excitation_mode = je_y_left, ferrite_model = Linear
# Согласованный перевод параметров ноутбука (СГС) в единицы ./mendrive (c = 1), масштаб длины L0 = 1 см, T0 = L0/c = 3.33564e-11 с.
#   x_code = x/L0;  omega_code = omega*L0/c;  sigma_code = sigma_СГС*L0/c  (и для sigma_e, и для sigma_m);  eps, mu -- те же числа;
#   поля -- те же гауссовы; j_code = j_СГС*L0/c;  P_code = P_СГС/c  =>  Н/кВт = 1e5*dTxx/(c*P_src) = force_per_kW_src
#   при length_unit_cm=1, time_unit_s=1/c (ниже).
# Частота: omega0 = Re(omega_QNM)/c = 1.7988142094590323e11/2.99792458e10 (ячейка 465). Другие частоты -- qnm_sweep.sh.
# Источник: je_ext_y = je0*exp(-i K_l (x+a)) (ячейки 21/280)  <->  skin_depth = 1/Im K_l, src_k_phase = Re K_l (K_l при этой omega0, k_z=0).
# Отличия от ноутбука: k_z = 0 (в ноутбуке pi/L_z = 0.0314 см^-1; при omega/c = 6 см^-1 вклад ~3e-4), стенки конечной толщины h_l, h_r
#   с PEC за ними (в ноутбуке полупространства; h_l = 5.0 delta_l, h_r = 6.9 delta_r -> разница в зазоре ~7e-4).
# N = 80: КОНТРОЛЬНЫЙ (заведомо неразрешённый) прогон: dx = 1.26e-2 см > h_l -> в левой стенке нет внутренних узлов E,
#   источник je_y не действует (P_src = 0), феррит = 0 ячеек. Ожидаемо: поля ~0, force_per_kW_src = nan. Сравните с N >= 16384.
N = 80
a = 0.5
h_l = 0.0001875
h_r = 0.00625
dt_frac = 0.5
excitation_mode = je_y_left
polarization = TE
ferrite_model = Linear
mu_zz_lin = 100
mu_yy_lin = 100
sigma_m_leak = 0.0021614953368840253
sigma_e_ferrite = 330.22845424617054
eps_ferrite = 16
sigma_e_left = 18762980.354896054
eps_left = 1
skin_depth = 3.75990053432236e-05
src_k_phase = 26596.448930483315
src_sigma_fix = 1
omega0 = 6.000198342077812
amp = 1
ramp_periods = 2
n_periods_total = 60
record_from_period = 40
last_frac = 0.5
fields_harm = 0,1
fields_harm_periods = 10
fields_harm_normalize = source
fields_snap_phases = 0,0.25,0.5,0.75
time_convention = minus
length_unit_cm = 1
time_unit_s = 3.3356409519815204e-11
area_cm2 = 1
ts_every = 0
fft_harmonics = 4
fft_bins = 50
threads = 1
out_dir = out/qnm_drive_je_y_left_linear_N80
