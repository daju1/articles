# FIELDS: экспорт полей нелинейного прогона (Preisach 1D, magnetic_right = jm_z_right, TE) --
# укороченный вариант notebook_preisach_magnetic.cfg. Гармоники n = 0 (средние за период: w, Sx, Txx),
# 1 (сравнима с QNM/частотными профилями ноутбуков), 2, 3 (нелинейные искажения), снимки в 4 фазах
# каждые 50 периодов (для контроля установления).
#   ./mendrive -c examples/fields_export_preisach_magnetic.cfg
#   python3 plot.py out/fields_pr_mag
#   python3 plot.py out/fields_pr_mag --compare linear_mode3.csv --xcol xa   # профиль из ноутбука (export_sage_profiles)
N = 160
ferrite_model = Preisach
excitation_mode = magnetic_right
bias_orientation = x
H0_bias = 4.0
n_sub = 2
n_fp = 2
n_newton = 4
n_hyst_pr = 2001
sigma_m_leak = 3.0
sigma_e_left = 3.0
sigma_m_leak_pr = 3.0
omega0 = 3.0
n_periods_total = 400
record_from_period = 100
amp = 1
fields_harm = 0,1,2,3
fields_harm_periods = 100
fields_harm_normalize = source
fields_snap_phases = 0,0.25,0.5,0.75
fields_snap_every_periods = 50
fields_snap_from_period = 0
time_convention = minus
fields_every_x = 1
out_dir = out/fields_pr_mag
threads = 4
ts_every = 10
ts_last_periods = 20
checkpoint_every_periods = 50
