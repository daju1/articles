# Повтор ячейки 4 ноутбука MenDriveCpp_run.ipynb (Preisach 1D, magnetic_right, amp=1)
# с исправленной диагностикой баланса. Запуск:
#   ./mendrive -c examples/notebook_preisach_magnetic.cfg
#   ./mendrive -c examples/notebook_preisach_magnetic.cfg --resume      # продолжить после остановки
# Другие amp: ./mendrive -c examples/notebook_preisach_magnetic.cfg amp=5 out_dir=out/pr_mag_amp5

N = 160
ferrite_model = Preisach
excitation_mode = magnetic_right
bias_orientation = x
H0_bias = 4.0
n_sub = 2
n_fp = 2
n_newton = 4
n_hyst_pr = 2001
sigma_m_leak = 3.0
sigma_e_left = 3.0
sigma_m_leak_pr = 3.0      # ноутбук сюда sigma_m_leak НЕ передаёт: остаётся значение по умолчанию 3.0
n_periods_total = 8000
record_from_period = 1000
amp = 1

# Скан: в выводах ноутбука пик 3.00 (это вне сетки arange(0.005, 2.005, 0.005) из кода
# main_cpp -- видимо, при запуске использовалась другая сетка). Частоту задаём явно;
# чтобы повторить скан, поставьте omega0 = 0 и, например, scan_lo=1 scan_hi=21 scan_step=1 fine_step=0.1
omega0 = 3.0

out_dir = out/pr_mag_amp1
threads = 4
ts_every = 10
ts_last_periods = 20
checkpoint_every_periods = 100
