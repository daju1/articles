# MODE: режим je_y_left (TE: Ey, Hz); соответствие: driving_mode_1 ('je_y, k_y=0, TE'), MenDrive_qnm.ipynb; = прежний electric_left.
# polarization = auto -> обновляется только пара TE (экономия), вторая пара тождественно 0.
#   ./mendrive -c examples/mode_je_y_left_TE.cfg
#   python3 plot.py out/mode_je_y_left                       # профили |F|, Re, Im, Arg по x, снимки по фазам
#   python3 linear1d.py out/mode_je_y_left                   # точный линейный профиль для тех же параметров
#   python3 plot.py out/mode_je_y_left --compare out/mode_je_y_left/linear_analytic_n1.csv
N = 160
ferrite_model = JA
excitation_mode = je_y_left
polarization = auto
bias_orientation = x
H0_bias = 4.0
n_sub = 2
n_fp = 2
n_newton = 4
sigma_m_leak = 3.0
sigma_e_left = 3.0
# скан резонанса (как smoke_ja.cfg); чтобы пропустить -- задайте omega0 > 0
omega0 = 0
scan_lo = 1
scan_hi = 21
scan_step = 1
fine_halfwidth = 0.9
fine_step = 0.1
n_periods_total = 60
record_from_period = 20
amp = 1
# FIELDS: профили полей
fields_harm = 1,2,3
fields_harm_periods = 20
fields_snap_phases = 0,0.25,0.5,0.75
fields_snap_every_periods = 0
time_convention = minus
threads = 2
out_dir = out/mode_je_y_left
